name: Dream Company 365-Day Cloud Auto-Promo & Watchdog

on:
  schedule:
    # Off-peak minute crons to avoid :00 UTC GitHub Actions queue congestion!
    # Morning Slot A: 07:17 KST (22:17 UTC) — 5-div Shorts/Reels + SEO/IndexNow + IG 5-Slide Carousels
    - cron: "17 22 * * *"
    # Evening Slot B: 19:23 KST (10:23 UTC) — Runs 2h AFTER 17:00 KST YouTube quota reset for guaranteed catch-up + Slot B!
    - cron: "23 10 * * *"
    # Weekly Sunday 23:10 KST (Sunday 14:10 UTC) — Anti-Goodhart Hill-Climbing Weight Evolution (48h+ matured, 80/20 quota)
    - cron: "10 14 * * 0"
    # Weekly Monday 06:11 KST (Sunday 21:11 UTC) — Single-Variable A/B Evolution + 45-day IG token refresh
    - cron: "11 21 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode (daily | stage2_yt_reset | token_refresh | written_promo | ab_evolve | hill_climb | dry_run)"
        required: false
        default: "daily"

permissions:
  contents: write

concurrency:
  group: dreamcompany-daily-auto-promo
  cancel-in-progress: false

jobs:
  cloud-auto-promo:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Cache FFmpeg, Playwright Chromium & static assets (protects 2,000 min/mo limit)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
            cloud_automation/.cache
          key: dc-promo-v3-${{ runner.os }}-${{ hashFiles('cloud_automation/requirements.txt') }}
          restore-keys: |
            dc-promo-v3-${{ runner.os }}-

      - name: Install lightweight dependencies, FFmpeg & Playwright Chromium (30fps Real-UI)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          python -m pip install --upgrade pip -q
          pip install -q -r cloud_automation/requirements.txt
          playwright install chromium
          playwright install-deps chromium > /dev/null 2>&1 || true

      - name: Run 24/7 Cloud 5-Div Video Render + YouTube Shorts + IG Reels Pipeline
        id: video_promo
        continue-on-error: true
        if: ${{ github.event.schedule != '10 14 * * 0' && github.event.inputs.mode != 'token_refresh' && github.event.inputs.mode != 'ab_evolve' && github.event.inputs.mode != 'hill_climb' && github.event.inputs.mode != 'stage2_yt_reset' }}
        env:
          RUN_MODE: ${{ github.event.inputs.mode || 'daily' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          HQ_MASTER_EMAIL: ${{ secrets.HQ_MASTER_EMAIL || 'beable9489@gmail.com' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: dreamcompany-reels-staging
          R2_VAULT_BUCKET: dreamcompany-flow-vault
          R2_PUBLIC_BASE: https://pub-c1592ad8d860431c9bf3d4dd12c228ef.r2.dev
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_TOM: ${{ secrets.YT_REFRESH_TOKEN_TOM }}
          YT_REFRESH_TOKEN_KFG: ${{ secrets.YT_REFRESH_TOKEN_KFG }}
          YT_REFRESH_TOKEN_GBA: ${{ secrets.YT_REFRESH_TOKEN_GBA }}
          YT_REFRESH_TOKEN_HERO: ${{ secrets.YT_REFRESH_TOKEN_HERO }}
          YT_REFRESH_TOKEN_KFK: ${{ secrets.YT_REFRESH_TOKEN_KFK }}
          IG_ACCESS_TOKEN_TOM: ${{ secrets.IG_ACCESS_TOKEN_TOM }}
          IG_USER_ID_TOM: ${{ secrets.IG_USER_ID_TOM }}
          IG_ACCESS_TOKEN_KFG: ${{ secrets.IG_ACCESS_TOKEN_KFG }}
          IG_USER_ID_KFG: ${{ secrets.IG_USER_ID_KFG }}
          IG_ACCESS_TOKEN_GBA: ${{ secrets.IG_ACCESS_TOKEN_GBA }}
          IG_USER_ID_GBA: ${{ secrets.IG_USER_ID_GBA }}
          IG_ACCESS_TOKEN_HERO: ${{ secrets.IG_ACCESS_TOKEN_HERO }}
          IG_USER_ID_HERO: ${{ secrets.IG_USER_ID_HERO }}
          IG_ACCESS_TOKEN_KFK: ${{ secrets.IG_ACCESS_TOKEN_KFK }}
          IG_USER_ID_KFK: ${{ secrets.IG_USER_ID_KFK }}
          HQ_TELEGRAM_BOT_TOKEN: ${{ secrets.HQ_TELEGRAM_BOT_TOKEN }}
          HQ_TELEGRAM_CHAT_ID: ${{ secrets.HQ_TELEGRAM_CHAT_ID }}
        run: |
          python -u -X utf8 cloud_automation/cloud_promo_runner.py

      - name: Run Stage 2 YouTube Reset, R2 5-Banner Sync, HERO Ep1 & Flagship MV (Post-Quota Priority #2)
        id: yt_stage2
        continue-on-error: true
        if: ${{ github.event.inputs.mode == 'stage2_yt_reset' || (github.event_name == 'schedule' && github.event.schedule != '10 14 * * 0') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_VAULT_BUCKET: dreamcompany-flow-vault
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_TOM: ${{ secrets.YT_REFRESH_TOKEN_TOM }}
          YT_REFRESH_TOKEN_KFG: ${{ secrets.YT_REFRESH_TOKEN_KFG }}
          YT_REFRESH_TOKEN_GBA: ${{ secrets.YT_REFRESH_TOKEN_GBA }}
          YT_REFRESH_TOKEN_HERO: ${{ secrets.YT_REFRESH_TOKEN_HERO }}
          YT_REFRESH_TOKEN_KFK: ${{ secrets.YT_REFRESH_TOKEN_KFK }}
        run: |
          python -u -X utf8 cloud_automation/yt_stage2_reset_and_captions.py --once-if-pending

      - name: Refresh Instagram Long-Lived Tokens (45-Day Auto Renewal + Prefix-Safe Watchdog)
        id: ig_token_refresh
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          HQ_MASTER_EMAIL: ${{ secrets.HQ_MASTER_EMAIL || 'beable9489@gmail.com' }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_ACCESS_TOKEN_TOM: ${{ secrets.IG_ACCESS_TOKEN_TOM }}
          IG_USER_ID_TOM: ${{ secrets.IG_USER_ID_TOM }}
          IG_ACCESS_TOKEN_KFG: ${{ secrets.IG_ACCESS_TOKEN_KFG }}
          IG_USER_ID_KFG: ${{ secrets.IG_USER_ID_KFG }}
          IG_ACCESS_TOKEN_GBA: ${{ secrets.IG_ACCESS_TOKEN_GBA }}
          IG_USER_ID_GBA: ${{ secrets.IG_USER_ID_GBA }}
          IG_ACCESS_TOKEN_HERO: ${{ secrets.IG_ACCESS_TOKEN_HERO }}
          IG_USER_ID_HERO: ${{ secrets.IG_USER_ID_HERO }}
          IG_ACCESS_TOKEN_KFK: ${{ secrets.IG_ACCESS_TOKEN_KFK }}
          IG_USER_ID_KFK: ${{ secrets.IG_USER_ID_KFK }}
        run: |
          python -u -X utf8 cloud_automation/ig_token_refresher.py

      - name: Run Written Promotion Engine (Ch1 SEO+IndexNow 2x/wk · Ch2 IG 5-Slide Carousel 3x/wk · ZERO Threads/LINE)
        id: written_promo
        continue-on-error: true
        if: ${{ github.event.schedule != '10 14 * * 0' && github.event.inputs.mode != 'token_refresh' && github.event.inputs.mode != 'ab_evolve' && github.event.inputs.mode != 'hill_climb' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: dreamcompany-reels-staging
          R2_PUBLIC_BASE: https://pub-c1592ad8d860431c9bf3d4dd12c228ef.r2.dev
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          IG_ACCESS_TOKEN_TOM: ${{ secrets.IG_ACCESS_TOKEN_TOM }}
          IG_USER_ID_TOM: ${{ secrets.IG_USER_ID_TOM }}
          IG_ACCESS_TOKEN_KFG: ${{ secrets.IG_ACCESS_TOKEN_KFG }}
          IG_USER_ID_KFG: ${{ secrets.IG_USER_ID_KFG }}
          IG_ACCESS_TOKEN_GBA: ${{ secrets.IG_ACCESS_TOKEN_GBA }}
          IG_USER_ID_GBA: ${{ secrets.IG_USER_ID_GBA }}
          IG_ACCESS_TOKEN_HERO: ${{ secrets.IG_ACCESS_TOKEN_HERO }}
          IG_USER_ID_HERO: ${{ secrets.IG_USER_ID_HERO }}
          IG_ACCESS_TOKEN_KFK: ${{ secrets.IG_ACCESS_TOKEN_KFK }}
          IG_USER_ID_KFK: ${{ secrets.IG_USER_ID_KFK }}
        run: |
          DOW=$(TZ=Asia/Seoul date +%u)
          HOUR=$(TZ=Asia/Seoul date +%H)
          # Run SEO + Carousel in Morning Slot (or manual dispatch) so evening slot never double-posts carousels
          if [ "$HOUR" -lt "14" ] || [ "${{ github.event.inputs.mode }}" = "written_promo" ]; then
            if [ "$DOW" = "1" ] || [ "$DOW" = "4" ] || [ "${{ github.event.inputs.mode }}" = "written_promo" ]; then
              python -u -X utf8 cloud_automation/written_promo_engine.py --publish-seo || true
              if [ -d "dist" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
                npx --yes wrangler pages deploy dist --project-name tom-pages --branch main --commit-dirty=true || true
              fi
              python -u -X utf8 cloud_automation/written_promo_engine.py --ping-indexnow || true
            fi
            if [ "$DOW" = "1" ] || [ "$DOW" = "3" ] || [ "$DOW" = "5" ] || [ "${{ github.event.inputs.mode }}" = "written_promo" ]; then
              python -u -X utf8 cloud_automation/ig_carousel_publisher.py || true
            fi
          fi

      - name: Run Weekly Hill-Climbing Weight Evolution (Sunday 23:10 KST — 48h Matured Anti-Goodhart 80/20)
        id: hill_climb
        continue-on-error: true
        if: ${{ github.event.schedule == '10 14 * * 0' || github.event.inputs.mode == 'hill_climb' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_ADMIN_TOKEN: ${{ secrets.WATCHDOG_ADMIN_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_TOM: ${{ secrets.YT_REFRESH_TOKEN_TOM }}
          YT_REFRESH_TOKEN_KFG: ${{ secrets.YT_REFRESH_TOKEN_KFG }}
          YT_REFRESH_TOKEN_GBA: ${{ secrets.YT_REFRESH_TOKEN_GBA }}
          YT_REFRESH_TOKEN_HERO: ${{ secrets.YT_REFRESH_TOKEN_HERO }}
          YT_REFRESH_TOKEN_KFK: ${{ secrets.YT_REFRESH_TOKEN_KFK }}
          IG_ACCESS_TOKEN_TOM: ${{ secrets.IG_ACCESS_TOKEN_TOM }}
          IG_USER_ID_TOM: ${{ secrets.IG_USER_ID_TOM }}
          IG_ACCESS_TOKEN_KFG: ${{ secrets.IG_ACCESS_TOKEN_KFG }}
          IG_USER_ID_KFG: ${{ secrets.IG_USER_ID_KFG }}
          IG_ACCESS_TOKEN_GBA: ${{ secrets.IG_ACCESS_TOKEN_GBA }}
          IG_USER_ID_GBA: ${{ secrets.IG_USER_ID_GBA }}
          IG_ACCESS_TOKEN_HERO: ${{ secrets.IG_ACCESS_TOKEN_HERO }}
          IG_USER_ID_HERO: ${{ secrets.IG_USER_ID_HERO }}
          IG_ACCESS_TOKEN_KFK: ${{ secrets.IG_ACCESS_TOKEN_KFK }}
          IG_USER_ID_KFK: ${{ secrets.IG_USER_ID_KFK }}
        run: |
          python -u -X utf8 cloud_automation/weekly_hill_climber.py || true

      - name: Run Weekly 3-Tier 2-Phase Promo Learning Engine (Monday 06:11 KST — Shadow 14d -> Active 70:30)
        id: ab_evolve
        continue-on-error: true
        if: ${{ github.event.schedule == '11 21 * * 0' || github.event.inputs.mode == 'ab_evolve' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WATCHDOG_ADMIN_TOKEN: ${{ secrets.WATCHDOG_ADMIN_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_2: ${{ secrets.YT_CLIENT_ID_2 }}
          YT_CLIENT_SECRET_2: ${{ secrets.YT_CLIENT_SECRET_2 }}
          YT_REFRESH_TOKEN_TOM: ${{ secrets.YT_REFRESH_TOKEN_TOM }}
          YT_REFRESH_TOKEN_KFG: ${{ secrets.YT_REFRESH_TOKEN_KFG }}
          YT_REFRESH_TOKEN_GBA: ${{ secrets.YT_REFRESH_TOKEN_GBA }}
          YT_REFRESH_TOKEN_HERO: ${{ secrets.YT_REFRESH_TOKEN_HERO }}
          YT_REFRESH_TOKEN_KFK: ${{ secrets.YT_REFRESH_TOKEN_KFK }}
          IG_ACCESS_TOKEN_TOM: ${{ secrets.IG_ACCESS_TOKEN_TOM }}
          IG_USER_ID_TOM: ${{ secrets.IG_USER_ID_TOM }}
          IG_ACCESS_TOKEN_KFG: ${{ secrets.IG_ACCESS_TOKEN_KFG }}
          IG_USER_ID_KFG: ${{ secrets.IG_USER_ID_KFG }}
          IG_ACCESS_TOKEN_GBA: ${{ secrets.IG_ACCESS_TOKEN_GBA }}
          IG_USER_ID_GBA: ${{ secrets.IG_USER_ID_GBA }}
          IG_ACCESS_TOKEN_HERO: ${{ secrets.IG_ACCESS_TOKEN_HERO }}
          IG_USER_ID_HERO: ${{ secrets.IG_USER_ID_HERO }}
          IG_ACCESS_TOKEN_KFK: ${{ secrets.IG_ACCESS_TOKEN_KFK }}
          IG_USER_ID_KFK: ${{ secrets.IG_USER_ID_KFK }}
        run: |
          python -u -X utf8 cloud_automation/ab_evolution_engine.py || true
          python -u -X utf8 cloud_automation/written_promo_engine.py --evolve-ab --ping-indexnow || true

      - name: Always Commit State & Keepalive (Fault-Isolated Nonstop Persistence)
        if: always()
        run: |
          git config user.name "DreamCompany Cloud Bot"
          git config user.email "hello@truthofmarket.com"
          git add data/promo_history.json data/message_matrix_5div.json data/flow_vault_manifest.json data/written_promo_ledger.json data/indexnow_config.json data/promo_learning_snapshot.json data/topic_hook_weights.json insights/ sitemap.xml rss.xml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cloud-promo): update nonstop promo state, weights & flow_vault [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          else
            echo "No state diff to commit."
          fi

      - name: Report Step Outcomes (Fail Job ONLY if All Active Channels Failed)
        if: always()
        run: |
          echo "yt_stage2=${{ steps.yt_stage2.outcome }}"
          echo "video_promo=${{ steps.video_promo.outcome }}"
          echo "ig_token_refresh=${{ steps.ig_token_refresh.outcome }}"
          echo "written_promo=${{ steps.written_promo.outcome }}"
          echo "hill_climb=${{ steps.hill_climb.outcome }}"
          echo "ab_evolve=${{ steps.ab_evolve.outcome }}"
          if [ "${{ steps.video_promo.outcome }}" = "failure" ] && [ "${{ steps.written_promo.outcome }}" = "failure" ]; then
            exit 1
          fi
