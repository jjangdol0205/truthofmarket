name: Daily US Market Close Price Sync

on:
  schedule:
    # Runs at 21:20 UTC (17:20 EST / 06:20 KST next day) Mon-Fri after US market close
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas numpy httpx

      - name: Sync latest US stock & ETF closing prices
        run: |
          python scripts/sync_live_market_data.py
          python scripts/build_static_bundle.py

      - name: Broadcast English Daily Briefing to @truthofmarketss
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@truthofmarketss"
        run: |
          python scripts/broadcast_telegram_channel.py --pin

      - name: Commit and push updated market snapshots & SEO insights
        run: |
          git config user.name "RightSideAlpha Quant Bot"
          git config user.email "bot@truthofmarket.com"
          python scripts/tom_auto_promotion_engine.py
          git add frontend/public/ dist/ static_api/ stocks/ compare/ insights/ index.html semi-fear-greed.html rss.xml feed.xml llms.txt llms-full.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync daily US market close prices, 134+ SEO pages & quant insights"
            git push
          fi
